# Runs the hosted hub in a container that is BUILT ON THE SERVER from this repository (nothing is pulled from a registry). In a clone of the
# repository on the server, in this folder (deploy/):
#
#   1. put the Discord application's client secret in a file called oauth-secret next to this file and let the container's user read it:
#        sudo chown 65532:65532 oauth-secret && sudo chmod 400 oauth-secret
#   2. make a file called .env next to it with:   DISCORD_CLIENT_ID=<the application id>
#   3. make the folder the hub keeps everything in, which is a plain folder on this machine and not a Docker volume, so replacing or upgrading
#      the container (or even deleting it with `docker compose down -v`) never touches it:
#        mkdir -p data && sudo chown 65532:65532 data
#   4. docker compose up -d --build          (the first build takes several minutes; to update: git pull, then the same command)
#
# Inside data/ is the file `kek`, which seals every saved bot token. BACK IT UP somewhere else too (and control.db): lose it and every saved
# bot token is gone. There is no database container: the hub's database is SQLite, a file in data/, written by the hub itself.
#
# The port is published on 127.0.0.1 only, so the only way in is the proxy on the same machine (nginx, doing TLS); it must pass the client's
# address on in X-Forwarded-For. The hub trusts that header only from this machine or a private network address.
# The older way of running the hub directly on the machine, without Docker, is in deploy/baremetal/.
services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    image: claudecord:local
    restart: unless-stopped
    command:
      - serve
      - --data=/data
      - --bind=0.0.0.0:8787
      - --allow-plain
      - --public-url=https://claudecord.kdhanda.com
      - --client-id=${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      - --secret-file=/run/secrets/oauth-secret
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
      - ./oauth-secret:/run/secrets/oauth-secret:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile: 65535
    stop_grace_period: 30s
