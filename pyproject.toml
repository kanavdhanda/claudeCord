# The pip package: `pip install claudecord` gives the `claudecord` command. maturin builds the Rust program and puts it in a
# platform wheel (no Python code, no compiler needed by the person installing). The version is read from Cargo.toml.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "claudecord"
dynamic = ["version"]
description = "Run Claude Code, agy and Codex agents on any machine as a Discord team"
readme = "scripts/npm/README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["claude", "codex", "agents", "discord", "tmux", "orchestrator"]
classifiers = [
  "Programming Language :: Rust",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/kanavdhanda/claudeCord"

[tool.maturin]
bindings = "bin"
strip = true
manifest-path = "crates/claudecord/Cargo.toml"
# The program lives in crates/claudecord, so files that are outside it have to be named or the source package would be missing them: the
# LICENSE (it is listed in the package's metadata, and PyPI refuses an upload that lists a license file it does not contain) and the fonts
# that crates/claudecord/src/device/shot.rs embeds (without them the package does not compile).
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "assets/fonts/*", format = "sdist" },
]

