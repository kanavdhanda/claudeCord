[package]
name = "claudecord-hub"
version.workspace = true
edition = "2024"
description = "claudeCord Hub: manage coding agents from Discord and web dashboard"
license = "MIT"
repository = "https://github.com/kanavdhanda/claudeCord"

[[bin]]
name = "claudecord-hub"
path = "src/main.rs"

[dependencies]
claudecord-protocol = { path = "../claudecord-protocol" }
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "io-std", "process", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
