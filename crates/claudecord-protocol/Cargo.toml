[package]
name = "claudecord-protocol"
version.workspace = true
edition = "2024"
description = "Wire protocol types and framing for claudeCord"
license = "MIT"
repository = "https://github.com/kanavdhanda/claudeCord"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.22"
getrandom = "0.4.3"
hmac = "0.13.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

