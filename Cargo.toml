[package]
name = "claudecord"
version = "0.2.0"
edition = "2024"
description = "Run Claude Code, agy and Codex agents on any machine as a Discord team"
license = "MIT"
repository = "https://github.com/kanavdhanda/claudeCord"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
interprocess = { version = "2.4.4", features = ["tokio"] }
portable-pty = "0.9.0"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "io-std", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
vt100 = "0.16.2"

[profile.release]
lto = "thin"
strip = true

# Debug builds keep line numbers for panics but skip full debug info: much faster to link, which matters most on Windows CI.
[profile.dev]
debug = "line-tables-only"
