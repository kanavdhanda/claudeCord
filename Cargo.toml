[workspace]
members = [
    "crates/claudecord-protocol",
    "crates/claudecord",
    "crates/claudecord-hub",
    "crates/claudecord-test-facade",
    "tests",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"

[profile.release]
lto = "thin"
strip = true

# The hub's Docker image: built for size (about 11 MB instead of 19). Panics are still caught (no `panic = "abort"`): the hub and the daemon rely on
# that to lose one step instead of the whole process.
[profile.release-hub]
inherits = "release"
lto = "fat"
codegen-units = 1
