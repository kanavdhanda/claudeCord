name: packaging

# The pip wheel and npm packages are built, installed into clean folders and run. Only when something that can change them does
# (the packaging files, the version, the dependencies); release.yml checks all three platforms before anything is published.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["npm/**", "pyproject.toml", "scripts/package_npm.py", "scripts/test_packaging.py", "Cargo.toml", "Cargo.lock", ".github/workflows/packaging.yml"]
  pull_request:
    paths: ["npm/**", "pyproject.toml", "scripts/package_npm.py", "scripts/test_packaging.py", "Cargo.toml", "Cargo.lock", ".github/workflows/packaging.yml"]

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/test_packaging.py
