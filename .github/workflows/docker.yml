name: docker

# Checks that the hub's container image still builds. Nothing is published anywhere: the image is built on the server itself
# (deploy/compose.yml), so a change to the Dockerfile or to what goes into it is caught here and not on the server.
# This repository holds two things in one program: the HUB (the server, in the container) and the machine side (the `claudecord` command and daemon,
# shipped to npm and PyPI by release.yml). This workflow is the hub's, so it skips changes that only touch the machine side (src/device,
# src/agents, the machine commands, the npm and pip packaging). Code both sides share (protocol, security) still runs it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "site/**"
      - "deploy/baremetal/**"
      - "src/device/**"
      - "src/agents/**"
      - "src/cli/machine.rs"
      - "src/cli/verbs.rs"
      - "npm/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - "deploy/baremetal/**"
      - "src/device/**"
      - "src/agents/**"
      - "src/cli/machine.rs"
      - "src/cli/verbs.rs"
      - "npm/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
