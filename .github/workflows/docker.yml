name: docker

# Builds the hub's container image and publishes it to GitHub's container registry (ghcr.io/kanavdhanda/claudecord), so the server only
# has to `docker compose pull`. Every push to main gives `latest` and a `sha-...` tag; a release tag such as v0.2.1 gives that version too.
# A pull request only builds the image, to prove it still builds. x86 only: add `platforms: linux/amd64,linux/arm64` once an ARM server is used.
# After the first push, open the package on GitHub (your profile > Packages > claudecord) and make it public, or `docker login ghcr.io` on the server.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, "src/**", "web/dist/**", "examples/**", .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/claudecord
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
