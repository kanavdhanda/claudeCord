name: docker

# Checks that the hub's container image still builds. Nothing is published anywhere: the image is built on the server itself
# (deploy/compose.yml), so a change to the Dockerfile or to what goes into it is caught here and not on the server.
on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, "src/**", "web/dist/**", "examples/**", .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
