name: deploy

# Continuous deployment of the HUB (the server). It runs by itself after the tests (rust.yml) pass on main, and also by hand with any git ref.
# The server builds the image itself from its clone of this repository (nothing goes to a registry), checks /readyz, and puts the previous
# version back if the new one does not become ready.
#
# It deploys only when something the hub is made of changed. Changes that only touch the machine side (the `claudecord` command and daemon
# shipped to npm and PyPI by release.yml: src/device, src/agents, the machine commands, packaging, docs) do not need a deploy and are skipped.
# Code both sides share (the protocol, security) does deploy. If a newer commit has arrived by the time this runs, that commit deploys itself
# and this one stops, so an older version never replaces a newer one.
#
# SET UP ONCE (Settings > Secrets and variables > Actions; the `production` environment can also hold them and require your approval):
#   secrets    DEPLOY_HOST          the server's address
#              DEPLOY_USER          the login on the server (it must be allowed to run `docker`)
#              DEPLOY_SSH_KEY       the PRIVATE key whose public half is in that user's ~/.ssh/authorized_keys on the server
#              DEPLOY_KNOWN_HOSTS   the server's host key line(s):  ssh-keyscan -t ed25519 <host>   (pins the server, so no one can pose as it)
#   variables  DEPLOY_DIR           the clone of this repository on the server, such as /opt/claudeCord (deploy/compose.yml set up inside it)
#              HUB_URL              https://claudecord.kdhanda.com
# Nothing deploys until DEPLOY_DIR is set.
on:
  workflow_run:
    workflows: [rust]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to run (a release tag, a branch, or a commit)
        required: true
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_DIR != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      AUTO: ${{ github.event_name == 'workflow_run' }}
      HUB_URL: ${{ vars.HUB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      # ---- HOW TO REACH THE SERVER: edit this step (and the host, user and key secrets) to match your setup. Everything below uses `ssh_`. ----
      - name: Trust only the server we pinned
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id; chmod 600 ~/.ssh/id
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/ssh_ <<'EOF'
          #!/usr/bin/env bash
          exec ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "$@"
          EOF
          chmod +x ~/ssh_
      # ---------------------------------------------------------------------------------------------------------------------------------------

      - name: Is there anything for the hub to deploy?
        id: decide
        run: |
          if [ "$AUTO" = true ]; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$REF" ]; then
              echo "a newer commit exists on main; it will deploy itself"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            deployed=$(~/ssh_ head || true)
            if [ -n "$deployed" ] && changed=$(git diff --name-only "$deployed" "$REF" 2>/dev/null); then
              hub=$(echo "$changed" | grep -vE '^(.*\.md|deploy/baremetal/|src/device/|src/agents/|src/cli/machine\.rs|src/cli/verbs\.rs|npm/|pyproject\.toml|scripts/|\.github/workflows/release\.yml)' || true)
              if [ -z "$hub" ]; then
                echo "only the machine side changed since $deployed; nothing for the hub"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Build on the server, restart, check, roll back on failure
        if: steps.decide.outputs.go == 'true'
        run: |
          # The deploy key can only run deploy/ci-entry.sh on the server (a forced command), which takes one of: head, deploy SHA, logs, rollback.
          # It keeps the running image as claudecord:previous, and the commit it came from in .previous, so a failed deploy can put it back.
          ~/ssh_ deploy "$(git rev-parse HEAD)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HUB_URL/readyz" || true)
            [ "$code" = "200" ] && { echo "ready after $i checks"; exit 0; }
            sleep 4
          done
          echo "the new version never became ready. Its log, so the reason is in this run:"
          ~/ssh_ logs || true
          echo "putting the previous one back"
          ~/ssh_ rollback
          exit 1
