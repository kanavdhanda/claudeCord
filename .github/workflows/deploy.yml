name: deploy

# Updates the hub on your server and checks it is ready. The server builds the image itself from a clone of this repository (nothing is
# published to a registry). If the new version does not become ready, the one that was running is put back. Run it by hand
# (Actions > deploy > Run workflow) with a git ref: a release tag such as v0.2.1, a branch, or a commit.
# Set up once: secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS; variables HUB_URL (https://claudecord.kdhanda.com) and
# DEPLOY_DIR (the clone of the repository on the server, such as /opt/claudeCord), with deploy/compose.yml already set up there.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to run (v0.2.1, main, or a commit)
        required: true
        default: main

concurrency: deploy

jobs:
  deploy:
    if: vars.DEPLOY_DIR != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trust only the server we pinned
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id; chmod 600 ~/.ssh/id
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Build on the server, restart, check, roll back on failure
        env:
          REF: ${{ inputs.ref }}
          DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh_ () { ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "$@"; }
          # The running image is kept as claudecord:previous, and the commit it came from in .previous, so a failed deploy can put it back.
          ssh_ "set -e; cd '$DIR' && git rev-parse HEAD > .previous && { docker tag claudecord:local claudecord:previous 2>/dev/null || true; } \
            && git fetch --tags origin && git checkout --detach '$REF' && cd deploy && docker compose up -d --build"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${{ vars.HUB_URL }}/readyz" || true)
            [ "$code" = "200" ] && { echo "ready after $i checks"; exit 0; }
            sleep 3
          done
          echo "the new version never became ready, putting the previous one back"
          ssh_ "set -e; cd '$DIR' && git checkout --detach \$(cat .previous) && docker tag claudecord:previous claudecord:local && cd deploy && docker compose up -d --no-build"
          exit 1
