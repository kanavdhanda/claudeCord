name: deploy

# Continuous deployment of the HUB (the server). It runs by itself after the tests (rust.yml) pass on main, and also by hand with any git ref.
# The server builds candidate images in an isolated staging worktree (nothing goes to a registry), verifies them via selftest and
# container readiness checks, and promotes them to primary only after staging succeeds. If deploy fails, the primary service is never disrupted.
#
# It deploys only when something the hub is made of changed. Changes that only touch the machine side (the `claudecord` command and daemon
# shipped to npm and PyPI by release.yml: src/device, src/agents, the machine commands, packaging, docs) do not need a deploy and are skipped.
# Code both sides share (the protocol, security) does deploy. If a newer commit has arrived by the time this runs, that commit deploys itself
# and this one stops, so an older version never replaces a newer one.
#
# SET UP ONCE (Settings > Secrets and variables > Actions; the `production` environment can also hold them and require your approval):
#   secrets    DEPLOY_HOST          the server's address
#              DEPLOY_USER          the login on the server (it must be allowed to run `docker`)
#              DEPLOY_SSH_KEY       the PRIVATE key whose public half is in that user's ~/.ssh/authorized_keys on the server
#              DEPLOY_KNOWN_HOSTS   the server's host key line(s):  ssh-keyscan -t ed25519 <host>   (pins the server, so no one can pose as it)
#   variables  DEPLOY_DIR           the clone of this repository on the server, such as /opt/claudeCord (deploy/compose.yml set up inside it)
#              HUB_URL              https://claudecord.kdhanda.com
# Nothing deploys until DEPLOY_DIR is set.
on:
  workflow_run:
    workflows: [rust]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to run (a release tag, a branch, or a commit)
        required: true
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_DIR != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      AUTO: ${{ github.event_name == 'workflow_run' }}
      DIR: ${{ vars.DEPLOY_DIR }}
      HUB_URL: ${{ vars.HUB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      # ---- HOW TO REACH THE SERVER: edit this step (and the host, user and key secrets) to match your setup. Everything below uses `ssh_`. ----
      - name: Trust only the server we pinned
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id; chmod 600 ~/.ssh/id
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/ssh_ <<'EOF'
          #!/usr/bin/env bash
          exec ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "$@"
          EOF
          chmod +x ~/ssh_
      # ---------------------------------------------------------------------------------------------------------------------------------------

      - name: Is there anything for the hub to deploy?
        id: decide
        run: |
          if [ "$AUTO" = true ]; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$REF" ]; then
              echo "a newer commit exists on main; it will deploy itself"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            deployed=$(~/ssh_ "cd '$DIR' && git rev-parse HEAD" || true)
            if [ -n "$deployed" ] && changed=$(git diff --name-only "$deployed" "$REF" 2>/dev/null); then
              hub=$(echo "$changed" | grep -vE '^(.*\.md|deploy/baremetal/|src/device/|src/agents/|src/cli/machine\.rs|src/cli/verbs\.rs|npm/|pyproject\.toml|scripts/|\.github/workflows/release\.yml)' || true)
              if [ -z "$hub" ]; then
                echo "only the machine side changed since $deployed; nothing for the hub"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Stage 1: Build candidate image in isolated staging worktree
        if: steps.decide.outputs.go == 'true'
        run: |
          echo "Building candidate image claudecord:staging on server from ref $REF..."
          ~/ssh_ "set -e; cd '$DIR'
            git fetch --tags origin
            git worktree prune 2>/dev/null || true
            rm -rf .staging_build 2>/dev/null || true
            git worktree add --detach .staging_build '$REF'
            cleanup() {
              cd '$DIR' && git worktree remove --force .staging_build 2>/dev/null || rm -rf .staging_build
              git worktree prune 2>/dev/null || true
            }
            trap cleanup EXIT
            cd .staging_build
            docker build -t claudecord:staging -f Dockerfile .
          "

      - name: Stage 2: Verify candidate in staging (selftest & container probe)
        if: steps.decide.outputs.go == 'true'
        run: |
          echo "Testing candidate image claudecord:staging before touching primary..."
          ~/ssh_ "set -e
            echo '==> 1. Running internal selftest in candidate container'
            docker run --rm --tmpfs /tmp claudecord:staging selftest

            echo '==> 2. Verifying candidate container startup and probe'
            docker rm -f claudecord-staging 2>/dev/null || true
            docker run -d --name claudecord-staging \
              --read-only --tmpfs /tmp --tmpfs /data \
              claudecord:staging \
              serve --data=/data --bind=0.0.0.0:8787 --allow-plain \
                    --public-url=http://127.0.0.1:8787 \
                    --client-id=staging-verify \
                    --secret-file=/etc/hosts

            ready=false
            for i in \$(seq 1 15); do
              if docker exec claudecord-staging /claudecord-hub probe http://127.0.0.1:8787 --once --data /tmp/probe >/dev/null 2>&1; then
                ready=true
                echo \"Candidate container verified ready after \$i checks\"
                break
              fi
              sleep 1
            done

            if [ \"\$ready\" != 'true' ]; then
              echo 'ERROR: Staging container failed readiness probe! Logs:'
              docker logs --tail 50 claudecord-staging 2>&1 || true
              docker rm -f claudecord-staging 2>/dev/null || true
              exit 1
            fi

            docker rm -f claudecord-staging 2>/dev/null || true
            echo 'Staging verification PASSED. Candidate image is ready for promotion.'
          "

      - name: Stage 3: Promote staged candidate to primary
        if: steps.decide.outputs.go == 'true'
        run: |
          echo "Promoting verified candidate image to primary claudecord:local..."
          ~/ssh_ "set -e; cd '$DIR'
            git rev-parse HEAD > .previous
            docker tag claudecord:local claudecord:previous 2>/dev/null || true
            docker tag claudecord:staging claudecord:local
            git checkout --detach '$REF'
            cd deploy
            docker compose up -d --no-build
          "

      - name: Stage 4: Verify primary live health and roll back on failure
        if: steps.decide.outputs.go == 'true'
        run: |
          echo "Verifying live primary service at $HUB_URL/readyz..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HUB_URL/readyz" || true)
            [ "$code" = "200" ] && { echo "Primary is healthy and ready after $i checks"; exit 0; }
            sleep 4
          done
          echo "ERROR: Primary failed /readyz check! Logs from primary hub:"
          ~/ssh_ "cd '$DIR/deploy' && docker compose logs --tail 50 hub 2>&1" || true
          echo "Rolling back primary to previous version..."
          ~/ssh_ "set -e; cd '$DIR'
            if [ -f .previous ]; then
              git checkout --detach \$(cat .previous)
            fi
            if docker image inspect claudecord:previous >/dev/null 2>&1; then
              docker tag claudecord:previous claudecord:local
            fi
            cd deploy
            docker compose up -d --no-build
          "
          exit 1
