name: pr-description

# Every pull request must say what it does to cost (agent turns and tokens) and to scale (users, machines, agents per hub). CI does
# not measure either one; the author states it, and a reviewer can ask for the numbers. This check only makes sure the question was
# answered, not left blank or at its placeholder.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  mentions-cost-and-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const answer = (label) => {
              const m = new RegExp('^' + label + ' impact:[ \\t]*(.*)$', 'im').exec(body);
              return m ? m[1].trim() : '';
            };
            const missing = ['Cost', 'Scale'].filter((l) => answer(l).replace(/[<>!\-\s]/g, '').length < 4);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- pr-description -->';
            const text = missing.length
              ? marker + '\n**Please fill in:** ' + missing.map((l) => l + ' impact').join(' and ') +
                '. Write "none, because ..." if the change does not touch it. See the pull request template for what each one means.'
              : marker + '\nCost impact and scale impact are both stated. Thank you.';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
            if (missing.length) core.setFailed('Missing: ' + missing.join(', '));
