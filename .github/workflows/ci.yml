name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test on ${{ matrix.name }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Native Windows has never run this suite, so a failure there is reported but does not block merging.
    # Remove `experimental` from that entry once it has passed.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", os: ubuntu-latest, node: 22 }
          - { name: "Linux x64", os: ubuntu-latest, node: 24 }
          - { name: "Linux arm64", os: ubuntu-24.04-arm, node: 24 }
          - { name: "macOS arm64 (Apple silicon)", os: macos-latest, node: 24 }
          - { name: "macOS x64 (Intel)", os: macos-15-intel, node: 24 }
          - { name: "Windows x64", os: windows-latest, node: 24, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The end to end tests drive real tmux panes. tmux does not exist on native Windows, so those tests skip there.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: End to end tests (real tmux)
        if: runner.os != 'Windows'
        run: pnpm test:e2e
      - name: Packaged CLI smoke test
        run: node scripts/ci/smoke-package.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fails if any total drops under the thresholds in vitest.config.ts.
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/ci/run.mjs coverage-summary
        env:
          COVERAGE_THRESHOLDS: '{"statements":88,"branches":78,"functions":86,"lines":90}'
      - name: Coverage of the lines this pull request added
        if: github.event_name == 'pull_request'
        run: node scripts/ci/run.mjs diff-coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF_COVERAGE: "80"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14

  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: grafana/setup-k6-action@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fails if routing slows down or memory grows. Measured on a laptop, 2000 agents are far under these.
      - name: Hub load test
        run: pnpm bench -- --stages 500,2000 --seconds 6 --assert --max-p99 100 --min-delivered 99.5 --max-rss 400
      - name: k6 smoke test (400 agents)
        run: |
          pnpm bench:serve --nodes 16 --port 8787 &
          for i in $(seq 1 30); do curl -sf localhost:8787/healthz && break; sleep 1; done
          k6 run --quiet --no-usage-report -e NODES=16 -e SESSION_S=15 -e TOKENS=./tokens.json packages/hub/bench/k6/agents.js
          K6_AGENTS=400 node scripts/ci/run.mjs k6-delivery k6-summary.json
          pkill -f '[b]ench/serve.ts' || true

  # One check to require in branch protection, so the list of required jobs never has to change.
  ci-ok:
    name: ci passed
    if: always()
    needs: [static, test, coverage, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every job passed
        run: |
          echo '${{ toJson(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
