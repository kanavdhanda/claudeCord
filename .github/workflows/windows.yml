name: windows

# Windows is built and tested natively, on its own so it can be run alone (Actions > windows > Run workflow). The stand-in-agent
# tests need a Unix shell and skip themselves here; the lints are run by rust.yml on Linux and macOS.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "site/**", "learnings/**", "deploy/**"]
  pull_request:
    paths-ignore: ["**.md", "site/**", "learnings/**", "deploy/**"]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test
      - run: cargo run -q -- selftest
