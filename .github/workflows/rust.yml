name: rust

# Format, lints, every test, the timing tests repeated, the self-check and the smoke test on Linux (x86 and ARM) and macOS, plus a
# small k6 run. Windows has its own workflow (windows.yml) and packaging has its own (packaging.yml), so each can be run alone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "site/**", "learnings/**", "deploy/**", ".github/workflows/windows.yml", ".github/workflows/packaging.yml"]
  pull_request:
    paths-ignore: ["**.md", "site/**", "learnings/**", "deploy/**"]

# A newer push replaces a run still going for the same branch, instead of queueing behind it.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The timing tests again, many times: a race that shows once in fifty runs is still a bug.
      - run: for i in $(seq 20); do cargo test --test races -q || exit 1; done
      - run: python3 scripts/codemap.py --check
      # Health checks last: every feature alive, then the shipped binary used the way a person would.
      - run: cargo run -q -- selftest
      - run: scripts/smoke.sh
  # A small k6 run (200 users with three bots each, under a minute) on every change. The big runs are in load.yml and wait for approval.
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: grafana/setup-k6-action@v1
      - run: cargo build --release --bin claudecord
      - run: scripts/load/smoke.sh 200 target/release/claudecord
