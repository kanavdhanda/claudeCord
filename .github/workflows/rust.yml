name: rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The timing tests again, many times: a race that shows once in fifty runs is still a bug.
      - run: for i in $(seq 20); do cargo test --test races -q || exit 1; done
      - run: python3 scripts/codemap.py --check
      # Health checks last: every feature alive, then the shipped binary used the way a person would.
      - run: cargo run -q -- selftest
      - run: scripts/smoke.sh
  # A small k6 run (200 users with three bots each, about a minute) on every change. The big runs are in load.yml and wait for approval.
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: grafana/setup-k6-action@v1
      - run: cargo build --release --bin claudecord
      - run: scripts/load/smoke.sh 200 target/release/claudecord
  # The pip wheel and npm packages are built, installed into clean folders and run, on every platform, on every change.
  packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/test_packaging.py
  # Windows is built and tested natively. The stand-in-agent tests need a Unix shell and skip themselves there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -q -- selftest
  # The cost benchmarks spend real tokens, so they run only when asked, never on every change.
  cost:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Spends real money, so it waits for your approval (Settings > Environments > spend-tokens > Required reviewers).
    environment: spend-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install -g @anthropic-ai/claude-code
      - run: python3 scripts/cost/benchmark.py --model sonnet --check
      - run: python3 scripts/cost/team_benchmark.py --model sonnet --check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
