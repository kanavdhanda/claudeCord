name: rust

# One pipeline, in order: the checks on Linux (x86 and ARM) and macOS, native Windows, and a small k6 run, all at once; then packaging
# (the pip wheel and npm packages installed in clean folders and run) only once all of those have passed, because there is no point
# packaging a build that fails its tests. Docs-only changes skip it, and a newer push replaces a run still going.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "learnings/**", "docs/**", "deploy/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "learnings/**", "docs/**", "deploy/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS", ".github/dependabot.yml"]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Every integration test is one program (tests/it), so it is compiled and linked once.
      - run: cargo test
      # The timing tests again, many times: a race that shows once in fifty runs is still a bug.
      - run: 'for i in $(seq 20); do cargo test --test it races:: -q || exit 1; done'
      - run: python3 scripts/codemap.py --check
      # Health checks last: every feature alive, then the shipped binary used the way a person would.
      - run: cargo run -q --bin claudecord-hub -- selftest
      - run: scripts/smoke.sh

  # Windows is built and tested natively. The stand-in-agent tests need a Unix shell and skip themselves there; the lints run
  # on Linux and macOS, and the Windows-only code is compiled by the test build.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test
      - run: cargo run -q --bin claudecord-hub -- selftest

  # A small k6 run (200 users with three bots each, under a minute). The big runs are in load.yml and wait for approval.
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: grafana/setup-k6-action@v1
      - run: cargo build --release --bin claudecord-hub
      - run: scripts/load/smoke.sh 200 target/release/claudecord-hub

  # Only once everything above has passed. macOS and Windows packaging are checked by release.yml before anything is published.
  packaging:
    needs: [check, windows, load-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/test_packaging.py
