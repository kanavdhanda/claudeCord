name: release

# Builds the program for each platform when a version tag is pushed, and attaches the files to a draft release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: contains(matrix.target, 'musl')
      - run: cargo build --release --target ${{ matrix.target }} --bin claudecord
      - run: cp target/${{ matrix.target }}/release/claudecord${{ contains(matrix.os, 'windows') && '.exe' || '' }} claudecord-${{ matrix.name }}
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: claudecord-${{ matrix.name }}
