name: release

# Push a tag such as v0.2.0 to release. One tag builds the program for every platform and makes, from those same builds:
#   - files on a draft GitHub release,
#   - pip wheels (PyPI),
#   - npm packages (one per platform, plus the main `claudecord` package).
# Publishing to PyPI and npm only happens when it is set up: PyPI uses trusted publishing (no secret to keep), npm uses the NPM_TOKEN
# repository secret (a granular token with read and write on all packages and "bypass two-factor" on, because no one is there to answer a passkey).
# Ship with scripts/release.sh X.Y.Z, which bumps the version, tags it and pushes; this file does the rest. Without them the release still builds and the draft release holds every file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The address a downloaded program goes to when nothing else is said (src/device/enroll.rs). It is built into every program: the npm
  # binaries, the wheels and the sdist all get it from here, so none of them can fall back to the placeholder address.
  CLAUDECORD_HUB: ${{ vars.HUB_URL }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag that does not match Cargo.toml would publish packages with the wrong number, so stop here.
      - run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1
          fi

  # Before anything is published, the packages are installed into clean folders and run on every platform.
  verify-packaging:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/test_packaging.py

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x64, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, ext: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: contains(matrix.target, 'musl')
      - run: cargo build --release --target ${{ matrix.target }} --no-default-features --bin claudecord
      - run: cp target/${{ matrix.target }}/release/claudecord${{ matrix.ext }} claudecord-${{ matrix.name }}${{ matrix.ext }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: claudecord-${{ matrix.name }}${{ matrix.ext }}

  # Wheels for glibc Linux (almost every distribution) are built in maturin's manylinux container, where the C compiler the TLS library needs is
  # present. The standalone programs further up are static musl builds, which is what npm and the release files use.
  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, extra: "", manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, extra: "", manylinux: "2014" }
          - { os: macos-latest, target: aarch64-apple-darwin, extra: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, extra: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, extra: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # An old glibc target (2014 = glibc 2.17) so the wheel installs on Ubuntu 22.04, Debian 12 and the like, not only the newest systems.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # The manylinux build runs in a container, which only sees the variables it is handed.
          docker-options: -e CLAUDECORD_HUB
          args: --release --out dist ${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Every program that gets published must have the hub address built in. 0.2.4's wheels were built without it and sent people to the placeholder
  # claudecord.example.com (which still appears in --help examples, so the check looks for the real address, not the absence of the placeholder). This runs on every build (not only tags), so a trial run on main shows it too.
  address:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,bin-*}"
          path: built
          merge-multiple: true
      - run: |
          want="${CLAUDECORD_HUB#https://}"
          [ -n "$want" ] || { echo "the HUB_URL repository variable is empty"; exit 1; }
          for f in built/*; do
            case "$f" in
              *.whl) look() { unzip -p "$f" '*claudecord*'; } ;;
              *) look() { cat "$f"; } ;;
            esac
            look | grep -aq "$want" || { echo "$f does not contain $want"; exit 1; }
            echo "ok  $f"
          done

  publish-pypi:
    needs: [build, wheels, sdist, verify-packaging, address]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      # Trusted publishing: PyPI is told once that this repository and workflow may publish, so there is no password to leak.
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: [build, verify-packaging, address]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: "bin-*"
          path: bins
          merge-multiple: true
      - run: python3 scripts/package_npm.py bins npm-out
      - id: have
        run: echo "token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.have.outputs.token == 'true'
        run: scripts/publish_npm.sh npm-out
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.have.outputs.token != 'true'
        run: echo "NPM_TOKEN is not set, so nothing was published to npm (the packages were built and checked)."

  github-release:
    needs: [build, wheels, sdist, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: files/*
