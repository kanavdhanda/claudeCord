name: pr-tests

# A bot that reads each pull request and comments when source changed without a test. It keeps one comment up to date
# instead of adding a new one each push, and fails the check so it is not missed.
on:
  pull_request:
    paths-ignore: ["**.md", "learnings/**", "docs/**", "LICENSE"]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests-came-with-the-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/tests_gate.py --self-check
      - id: gate
        run: |
          set +e
          python3 scripts/tests_gate.py "origin/${{ github.base_ref }}" > verdict.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = '<!-- tests-gate -->\n' + require('fs').readFileSync('verdict.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body.startsWith('<!-- tests-gate -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - if: steps.gate.outputs.status != '0'
        run: exit 1
