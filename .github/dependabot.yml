# Opens pull requests for new versions of the Rust crates and the GitHub actions. Each one runs the full CI, so an update
# only merges when every test, the self-check and the smoke test still pass.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
