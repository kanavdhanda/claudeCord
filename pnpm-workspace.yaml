packages:
  - "packages/*"
allowBuilds:
  esbuild: true
# braces <= 3.0.3 has a stack-exhaustion advisory, and the registry has no patched release. It reaches us only through
# @changesets/cli, a release-time tool that matches globs from our own config and never sees untrusted input.
# Revisit when a patched braces ships. CI still fails on any advisory in production dependencies.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
