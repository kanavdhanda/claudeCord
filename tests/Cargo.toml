[package]
name = "claudecord-it"
version.workspace = true
edition = "2024"
publish = false

[[test]]
name = "it"
path = "it/main.rs"

[dependencies]
claudecord = { package = "claudecord-test-facade", path = "../crates/claudecord-test-facade" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "io-std", "process", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
futures-util = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.11.1"
flate2 = "1.1.10"
base64 = "0.22"
sha2 = "0.11.0"
hmac = "0.13.0"
getrandom = "0.4.3"
